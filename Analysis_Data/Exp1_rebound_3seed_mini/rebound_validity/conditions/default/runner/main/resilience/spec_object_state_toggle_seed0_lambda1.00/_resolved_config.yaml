evaluation:
  planner:
    plan_config:
      llm:
        llm:
          _target_: habitat_llm.llm.Llama
          _partial_: true
        host: 127.0.0.1
        port: 8000
        serverdir: ''
        inference_mode: vllm
        system_tag: '<|im_start|>system

          '
        user_tag: '<|im_start|>user

          '
        assistant_tag: '<|im_start|>assistant

          '
        eot_tag: '<|im_end|>

          '
        generation_params:
          engine: Qwen3-8B-Instruct
          prompt: ''
          max_tokens: 2048
          temperature: 0.3
          'n': 1
          best_of: 1
          stop:
          - <|im_end|>
          - \n\n\n
          batch_response: false
          do_sample: false
          repetition_penalty: 1.1
          top_k: 50
          top_p: 1.0
        api_mode: auto
      instruct:
        prompt: '{system_tag}You are a system that solves multi-agent planning tasks.
          The task assigned to you will be situated in a house and will generally
          involve navigating to objects, picking and placing them on different receptacles
          to achieve rearrangement. There will be a robot agent (Agent 0) and a human
          agent (Agent 1) available for solving the task. Your goal is to assign actions
          for both of these agents and solve the task. You strictly follow any format
          specifications and pay attention to the previous actions taken in order
          to avoid repeating mistakes.


          You should try and divide the task between the two agents for efficient
          task completion. Note that the human agent can wash, clean, fill, pour and
          turn on/off devices along with doing object rearrangement. However, the
          robot can only do object rearrangement i.e., navigating to objects, picking
          and placing them.


          In the beginning, you will be provided with the task description and information
          about the rooms plus furniture in each room for the house. Object information
          may or may not be available. Rooms only need to be explored if there is
          no information available about task-relevant objects. Rooms do not need
          to be explored for identifying which furniture to to go to. Also, rooms
          do not need to be explored more than once. This means if one of your agents
          has explored the living room and have not found the object, then you should
          explore the kitchen, if a relevant object is still not found, you should
          explore the hallway etc.


          Many calls to the same action in a row are a sign that something has gone
          wrong and you should try a different action.


          You should try to complete the task in the least amount of actions possible.
          This means if there are two objects to be moved you should have one agent
          navigate to each object and then move them to the target location a the
          same time.


          If a previous navigation action is still in progress for an agent, you should
          reassign that action to the agent till a successful execution is observed
          in the agent''s observations.


          You should continue to evaluate the task progress and decide the actions
          for both the agents. Once both agents are done, you can output "Done[]"
