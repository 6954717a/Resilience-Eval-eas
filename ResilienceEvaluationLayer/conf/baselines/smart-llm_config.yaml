# @package _global_

defaults:
  - qwen3_centralized_zero_shot_react_summary_vllm
  - _self_

evaluation:
  adca:
    enabled: false
    llm_model: "gpt-4o-2024-11-20"
    llm_base_url: "${oc.env:HABITAT_LLM_BASE_URL,http://127.0.0.1:8000/v1}"
    adca_alpha: 1.0
    adca_fix_base: 0.2
    adca_orm_distribution: "last_step"

  context_evolve:
    enabled: true
    batch_size: 15
    retry_ratio: 0.5
    max_retries: 3
    max_history: 3
    max_context_chars: 2000

  critic:
    enabled: true
    
    # Core RL parameters
    gamma: 0.80
    gae_lambda: 0.65
    n_step: 5
    
    # Network architecture
    text_dim: 384
    numerical_dim: 32
    encoder_hidden_dim: 256
    state_dim: 128
    value_hidden_dims: [256, 128, 64]
    dropout_rate: 0.1
    
    # Optimization
    value_lr: 0.001
    
    # LLM integration
    use_llm_shaping: true
    use_llm_offline: true
    shaping_weight: 0.5
    llm_call_frequency: 5
    # llm_model: "kimi-k2-0905-preview" # Check available models
    llm_model: "gpt-4o-2024-11-20"
    cache_size: 1000
    
    # Custom API Configuration
    llm_base_url: "${oc.env:HABITAT_LLM_BASE_URL,http://127.0.0.1:8000/v1}"
    # Credentials are read from OPENAI_API_KEY; do not store them in this file.
    
    # Analysis & Checkpoints
    save_analyses: true
    analysis_save_dir: "./analyses"
    analyze_frequency: 1
    save_checkpoints: false
    checkpoint_frequency: 10
    checkpoint_dir: "./checkpoints"
    
    # Device
    device: "cuda"
    
    # Logging
    log_statistics: true

    # Debug (StateEncoder + RewardShaper)
    debug: true
    state_encoder_debug: true
    state_encoder_debug_frequency: 1
    state_encoder_debug_max_entries: 2000
    state_encoder_debug_log_state: true
    state_encoder_debug_log_next_state: false
    save_shaping_logs: true
    reward_shaper_json_mode: true
    reward_shaper_log_frequency: 1
    reward_shaper_log_max_entries: 20000
    reward_shaper_log_cache_hits: false
    state_encoder_debug_log_on_change: true
    state_encoder_debug_change_threshold: 0.01
    state_encoder_debug_signature_mode: semantic

  safety_monitor:
    enabled: false
    collision_penalty: 1.0
    min_dist_threshold: 0.5
    unsafe_state_penalty: 0.5

  planner:
    plan_config:
      use_task_decomposition: true
      rebound:
        enabled: false
        max_retries: 3
        startup_grace_period: 20
        detectors:
          context_overflow: false # Disabled because context-overflow refinement is not implemented.
          graph_inconsistency: true
          tool_failure_burst: true
          progress_stagnation: true # Use with the startup grace period and multi-agent filtering.
          immediate_error: true
