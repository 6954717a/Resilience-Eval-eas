# @package _global_

defaults:
  - /baselines/qwen35_centralized_zero_shot_react_summary_vllm_state
  - /evaluation/resilience_config
  - _self_

expq3:
  output_subdir: "expq3"
  baseline_model: "baselines/qwen35_centralized_zero_shot_react_summary_vllm_state"
  optimized_model: "condition_defined_patch"
  shared:
    working_set: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
  subexperiments:
    rebound_optimization:
      enabled: true
      argument: "Evaluate whether monitor/context correction injection reduces recovery cost, especially cognitive recovery cost."
      headline_metric: "rebound_c_rec"
      support_metrics:
        - "rebound_c_rec_cog"
        - "rebound_num_recovery_windows"
        - "task_percent_complete"
      episode_ids: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
      postprocess: ["stability"]
      summary_group_keys: ["condition_name", "perturbation_type"]
      conditions:
        - name: "baseline"
          label: "baseline"
          patch: {}
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "rebound"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "perturbed_main"
              patch:
                resilience:
                  mode: "rebound"
                  perturbations: ["surface_rewrite"]
                  seeds: [0]
                  intensities: [1.0]
        - name: "optimized"
          label: "rebound_context_fix"
          patch:
            evaluation:
              adca:
                enabled: true
              planner:
                plan_config:
                  rebound:
                    context_compression:
                      enabled: true
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "rebound"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "perturbed_main"
              patch:
                resilience:
                  mode: "rebound"
                  perturbations: ["surface_rewrite"]
                  seeds: [0]
                  intensities: [1.0]

    stability_optimization:
      enabled: true
      argument: "Evaluate whether a stability-oriented prompt/state constraint proxy improves beta-stability. The default patch is conservative and runnable; explicit anchoring can replace it later."
      headline_metric: "stability_beta_neighborhood"
      support_metrics:
        - "stability_beta_trajectory"
        - "stability_beta_out"
        - "task_percent_complete"
      episode_ids: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
      postprocess: ["stability"]
      summary_group_keys: ["condition_name", "perturbation_type"]
      conditions:
        - name: "baseline"
          label: "baseline"
          patch: {}
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "stability"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "perturbed_main"
              patch:
                resilience:
                  mode: "stability"
                  perturbations: ["surface_rewrite"]
                  seeds: [0]
                  intensities: [1.0]
        - name: "optimized"
          label: "stability_proxy_patch"
          patch:
            evaluation:
              adca:
                enabled: true
              critic:
                use_llm_shaping: true
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "stability"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "perturbed_main"
              patch:
                resilience:
                  mode: "stability"
                  perturbations: ["surface_rewrite"]
                  seeds: [0]
                  intensities: [1.0]

    ge_optimization:
      enabled: true
      argument: "Evaluate whether graceful fallback or boundary-aware proxy optimization increases boundary capacity and curve area under high stress. The default patch uses runnable options already available in this repository."
      headline_metric: "ge_boundary_lambda_star"
      support_metrics:
        - "ge_audc_f"
        - "ge_boundary_hit"
        - "task_percent_complete"
      episode_ids: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
      postprocess: ["stability", "margin"]
      summary_group_keys: ["condition_name", "stress_lambda"]
      conditions:
        - name: "baseline"
          label: "baseline"
          patch: {}
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "margin"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "stress_sweep"
              patch:
                resilience:
                  mode: "margin"
                  perturbations: ["irrelevant_perturbation"]
                  seeds: [0]
                  intensities: [0.0, 0.2, 0.5, 0.8, 1.0]
        - name: "optimized"
          label: "ge_proxy_patch"
          patch:
            evaluation:
              adca:
                enabled: true
              critic:
                use_llm_shaping: true
              planner:
                plan_config:
                  rebound:
                    context_compression:
                      enabled: true
          phases:
            - label: "clean_reference"
              patch:
                resilience:
                  mode: "margin"
                  perturbations: ["clean"]
                  seeds: [0]
                  intensities: [1.0]
            - label: "stress_sweep"
              patch:
                resilience:
                  mode: "margin"
                  perturbations: ["irrelevant_perturbation"]
                  seeds: [0]
                  intensities: [0.0, 0.2, 0.5, 0.8, 1.0]
