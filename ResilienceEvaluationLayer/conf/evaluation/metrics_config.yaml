# Metrics Configuration
#
# Episode-level runtime metrics are Rebound and Stability. Boundary/GE is a
# multi-rollout postprocessor; there is no separate Degradation runtime metric.
# 1. Rebound: Recovery from failures (B_epi, MTTR, MTBF, RR, T_rec)
# 2. Stability: Output consistency under perturbation (β, σ²_V, N_replan, P_cbf)

metrics:
  # Rebound Dimension: Recovery from failures
  rebound:
    enabled: true
    gamma: 2.0  # Backtrack weight for B_epi calculation (B_epi = N_retry + γ*N_backtrack)

  # Stability Dimension: Policy stability under perturbation
  stability:
    enabled: true
    use_saycan_scores: false  # Include SayCan-specific stability metrics (if planner supports it)
    value_variance_window: 10  # Window size for computing value function variance

# Independent Analysis Modules (preserved for backward compatibility)
adca:
  enabled: false
  llm_base_url: null
  llm_api_key: null

critic:
  enabled: true
  log_critic_stats: true
  analysis_export_enabled: true
