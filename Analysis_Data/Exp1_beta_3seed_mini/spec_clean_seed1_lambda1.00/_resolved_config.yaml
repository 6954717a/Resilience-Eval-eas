evaluation:
  planner:
    plan_config:
      llm:
        llm:
          _target_: habitat_llm.llm.Llama
          _partial_: true
        host: 127.0.0.1
        port: 8000
        serverdir: ''
        inference_mode: vllm
        system_tag: '<|im_start|>system

          '
        user_tag: '<|im_start|>user

          '
        assistant_tag: '<|im_start|>assistant

          '
        eot_tag: '<|im_end|>

          '
        generation_params:
          engine: Qwen3.5-9B-YOYO-Instruct
          prompt: ''
          max_tokens: 2048
          temperature: 0.7
          'n': 1
          best_of: 1
          stop:
          - <|im_end|>
          - '



            '
          batch_response: false
          do_sample: false
          repetition_penalty: 1.1
          top_k: 50
          top_p: 1.0
          batch_size: 4
        api_mode: auto
      instruct:
        prompt: '{system_tag}You are an expert multi-agent planning system.

          Solve the given multi-agent planning problem as best as you can. The task
          assigned to you will be situated in a house and will generally involve navigating
          to objects, picking and placing them on different receptacles to achieve
          rearrangement. Below is the detailed description of the actions you can
          use for solving the task. You can assign them to Agent_0 and/or Agent_1
          as required.

          Rules:

          - Follow the exact response format shown in the examples. Output only the
          plan and the termination line.

          - If you receive extra user turns labeled "Context Update", "Phase Guidance",
          "Rebound Guidance", or "Feedback", treat them as read-only context. Do not
          answer them directly, and continue planning for the current Task.

          - Do not repeat or quote any context updates in your output.

          - When you receive "Feedback" messages, you MUST generate a "Thought:" that
          reflects on the feedback before planning the next action. Your Thought should
          analyze what happened (success/failure), why it happened, and what you should
          do next.

          - If an action failed according to the Feedback, use your Thought to reason
          about alternative approaches before trying again.

          - BEFORE outputting "Final Thought: Exit!", you MUST verify that ALL task
          goals are met. Check that every object mentioned in the task has been successfully
          placed in its target location. If any object is still in an agent''s hand
          or not at the target, DO NOT EXIT. Continue planning until placement is
          confirmed.


          {agent_descriptions}{eot_tag}{user_tag}Here are some examples of planning:


          Example 1:

          Task:

          Move all objects from sofa to bedroom


          House description:

          living_room_0: chair_0, chair_1, chair_2, chair_3, table_0, couch_0, couch_1,
          table_1, table_2, table_3

          closet_0: shelves_0

