# @package _global_

defaults:
  - centralized_zero_shot_react_summary
  - override /planner@evaluation.planner: qwen_llm_centralized_motortoolsonly
  - override /instruct@evaluation.planner.plan_config.instruct: qwen_few_shot_centralized_motoronly_new
  - _self_

# vLLM override for Qwen3.5
evaluation:
  planner:
    plan_config:
      llm:
        inference_mode: vllm
        host: 127.0.0.1
        port: 8000
        api_mode: auto
        # Optional OpenAI-compatible root, e.g. http://127.0.0.1:8000/v1
        served_model_name: "${oc.env:QWEN35_SERVED_MODEL}"
        generation_params:
          engine: "${oc.env:QWEN35_SERVED_MODEL}"
          max_tokens: 2048
          temperature: 0.7
          stop: ["<|im_end|>", "\n\n\n"]
