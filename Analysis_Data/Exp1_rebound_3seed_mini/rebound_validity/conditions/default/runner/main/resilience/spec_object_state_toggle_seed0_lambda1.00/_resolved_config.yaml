    preemption:
      append_slurm_job_id: false
      save_resume_state_interval: 100
      save_state_batch_only: false
    policy:
      main_agent:
        name: PointNavResNetPolicy
        action_distribution_type: categorical
        action_dist:
          use_log_std: true
          use_softplus: false
          std_init: ???
          log_std_init: 0.0
          use_std_param: false
          clamp_std: true
          min_std: 1.0e-06
          max_std: 1
          min_log_std: -5
          max_log_std: 2
          action_activation: tanh
          scheduled_std: false
        obs_transforms: {}
        hierarchical_policy: ???
      agent_0:
        name: PointNavResNetPolicy
        action_distribution_type: gaussian
        action_dist:
          use_log_std: true
          use_softplus: false
          std_init: -1.0
          log_std_init: 0.0
          use_std_param: true
          clamp_std: true
          min_std: 1.0e-06
          max_std: 1
          min_log_std: -5
          max_log_std: 2
          action_activation: tanh
          scheduled_std: false
        obs_transforms: {}
        hierarchical_policy: ???
      agent_1:
        name: PointNavResNetPolicy
        action_distribution_type: gaussian
        action_dist:
          use_log_std: true
          use_softplus: false
          std_init: -1.0
          log_std_init: 0.0
          use_std_param: true
          clamp_std: true
          min_std: 1.0e-06
          max_std: 1
          min_log_std: -5
          max_log_std: 2
          action_activation: tanh
          scheduled_std: false
        obs_transforms: {}
        hierarchical_policy: ???
    ppo:
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 1
      value_loss_coef: 0.5
      entropy_coef: 0.001
      lr: 0.0003
      eps: 1.0e-05
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: true
      use_linear_lr_decay: false
      use_linear_clip_decay: false
      gamma: 0.99
      tau: 0.95
