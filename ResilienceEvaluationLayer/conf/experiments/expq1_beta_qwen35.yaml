# @package _global_

defaults:
  - /baselines/qwen35_centralized_zero_shot_react_summary_vllm_state
  - /evaluation/resilience_config
  - _self_

evaluation:
  max_episode_sim_steps: 18000
  adca:
    llm_model: "gpt-5.1"
    llm_base_url: "${oc.env:HABITAT_LLM_BASE_URL,http://127.0.0.1:8000/v1}"
  critic:
    llm_model: "gpt-5.1"
    llm_base_url: "${oc.env:HABITAT_LLM_BASE_URL,http://127.0.0.1:8000/v1}"
    # Keep the value/TD/GAE trace deterministic; otherwise dropout noise can
    # be mistaken for execution instability.
    inference_mode: "deterministic"
    analysis_export_enabled: true
    analysis_export_record_mode: "state_only"
    analysis_export_minimal_schema: true
    analysis_export_keep_td_error_topk: 8
    analysis_export_include_reward_fields: true
    analysis_export_include_next_value_features: false
    stability_oscillation_component_weights: [1.0, 1.0, 1.0, 0.25]

expq1:
  output_subdir: "expq1_beta_qwen35"
  baseline_model: "baselines/qwen35_centralized_zero_shot_react_summary_vllm_state"
  optimized_model: null
  shared:
    working_set: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
    base_patch:
      resilience:
        stability:
          perturbation_norm_epsilon: 1.0e-6
        beta:
          # Eq. (6) beta uses the stage-Mahalanobis trajectory loss only.
          # Output/action sensitivities remain support diagnostics.
          alpha: 0.5
          perturbation_norm_epsilon: 1.0e-6
          include_rebound: false
        stage_baseline:
          enabled: true
          baseline_only: false
          clean_tag: "clean"
          episode_aggregate:
            enabled: true
            fallback_when_hash_missing: true
            merge_existing: true

  subexperiments:
    stability_execution_validity:
      enabled: true
      argument: "Validate beta-stability as execution oscillation sensitivity under semantically equivalent perturbations, with action/progress/success changes as support evidence."
      headline_metric: "stability_beta_perturbation"
      support_metrics:
        - "stability_beta_perturbation_trajectory"
        - "stability_beta_perturbation_out"
        - "stability_beta_perturbation_oscillation"
        - "stability_beta_perturbation_action"
        - "stability_beta_perturbation_progress"
        - "stability_beta_perturbation_success"
        - "stability_beta_perturbation_valid"
        - "stability_beta_neighborhood"
        - "stability_beta_out"
        - "stability_beta_trajectory"
        - "stability_beta_oscillation"
        - "stability_beta_action"
        - "stability_beta_progress"
        - "stability_beta_success"
        - "stability_beta_neighborhood_valid"
        - "stability_td_error_mean_abs"
        - "stability_td_error_p95_abs"
        - "stability_gae_mean_abs"
        - "stability_gae_p95_abs"
        - "stability_return_target_variance"
        - "stability_oscillation_loss"
        - "stability_oscillation_loss_valid"
        - "stability_critic_trace_len"
        - "stability_value_delta_variance"
        - "sim_step_count"
        - "replanning_count_0"
        - "replanning_count_1"
        - "task_percent_complete"
        - "task_state_success"
      episode_ids: [126, 127, 78, 129, 125, 1, 9, 60, 11, 79, 80, 81]
      postprocess: ["stability"]
      summary_group_keys: ["condition_name", "perturbation_type", "perturbation_intensity"]
      summary_metrics:
        - "stability_beta_perturbation"
        - "stability_beta_perturbation_trajectory"
        - "stability_beta_perturbation_out"
        - "stability_beta_perturbation_oscillation"
        - "stability_beta_perturbation_action"
        - "stability_beta_perturbation_progress"
        - "stability_beta_perturbation_success"
        - "stability_beta_perturbation_valid"
        - "stability_beta_neighborhood"
        - "stability_beta_trajectory"
        - "stability_beta_out"
        - "stability_beta_oscillation"
        - "stability_beta_action"
        - "stability_beta_progress"
        - "stability_beta_success"
        - "stability_td_error_mean_abs"
        - "stability_td_error_p95_abs"
        - "stability_gae_mean_abs"
        - "stability_gae_p95_abs"
        - "stability_return_target_variance"
        - "stability_oscillation_loss"
        - "stability_oscillation_loss_valid"
        - "stability_critic_trace_len"
        - "stability_value_delta_variance"
        - "sim_step_count"
        - "replanning_count_0"
        - "replanning_count_1"
        - "task_percent_complete"
        - "task_state_success"
      phases:
        - label: "main"
          patch:
            resilience:
              mode: "stability"
              perturbations: ["clean", "surface_rewrite", "filler_injection"]
              seeds: [0]
              intensities: [1.0]
