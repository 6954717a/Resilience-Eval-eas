# @package _global_

defaults:
  - /baselines/qwen35_centralized_zero_shot_react_summary_vllm_state
  - /evaluation/resilience_config
  - _self_

expq1:
  output_subdir: "expq1"
  baseline_model: "baselines/qwen35_centralized_zero_shot_react_summary_vllm_state"
  optimized_model: null
  shared:
    working_set: [78, 127, 126, 11, 79, 80, 81, 128, 129, 125, 1, 9, 60, 73, 168, 237]
    base_patch:
      resilience:
        stage_baseline:
          episode_aggregate:
            enabled: true
            fallback_when_hash_missing: true
            merge_existing: true
  subexperiments:
    rebound_validity:
      enabled: true
      argument: "证明二元成功率会掩盖恢复代价，尤其是认知空转；对比 clean 与扰动下的 resilient success。"
      headline_metric: "rebound_c_rec"
      support_metrics:
        - "rebound_c_rec_cog"
        - "rebound_c_rec_phy"
        - "rebound_c_rec_state_debt"
        - "rebound_num_recovery_windows"
        - "rebound_raw_window_count"
        - "rebound_formal_window_count"
        - "rebound_skipped_window_count"
        - "rebound_c_rec_valid"
      episode_ids: [78, 127, 126, 11, 79, 80, 81, 128]
      postprocess: ["stability"]
      summary_group_keys: ["condition_name", "perturbation_type", "perturbation_intensity"]
      phases:
        - label: "main"
          patch:
            resilience:
              mode: "rebound"
              perturbations: ["clean", "surface_rewrite", "object_state_toggle"]
              seeds: [0, 1, 2]
              intensities: [1.0]

    stability_validity:
      enabled: true
      argument: "证明 β-stability 捕捉的是语义等价输入下的动作一致性，而不是简单重述成功率。"
      headline_metric: "stability_beta_neighborhood"
      support_metrics:
        - "stability_beta_vv"
        - "stability_beta_out"
        - "stability_beta_action"
        - "stability_beta_progress"
        - "stability_beta_success"
        - "stability_beta_neighborhood_valid"
        - "stability_beta"
      episode_ids: [126, 127, 78, 129, 125, 1, 9, 60]
      postprocess: ["stability"]
      summary_group_keys: ["condition_name", "perturbation_type", "perturbation_intensity"]
      phases:
        - label: "main"
          patch:
            resilience:
              mode: "stability"
              perturbations: ["clean", "surface_rewrite", "filler_injection"]
              seeds: [0, 1, 2]
              intensities: [1.0]

    ge_validity:
      enabled: true
      argument: "证明 GE 指标表达的是系统仍可承受多少额外压力，而不是只重述 success 的下降。"
      headline_metric: "ge_contract_margin_min"
      support_metrics:
        - "ge_audc_f"
        - "ge_cell_valid"
        - "ge_valid_lambda_coverage"
        - "ge_boundary_lambda_star"
        - "ge_boundary_hit"
        - "ge_hard_boundary_hit"
      episode_ids: [78, 127, 126, 11, 79, 80, 81, 128, 129, 125, 1, 9, 60, 73, 168, 237]
      postprocess: ["margin"]
      summary_group_keys: ["condition_name", "perturbation_type", "stress_lambda"]
      phases:
        - label: "clean_reference"
          patch:
            resilience:
              mode: "margin"
              perturbations: ["clean"]
              seeds: [0, 1, 2]
              intensities: [1.0]
        - label: "stress_sweep"
          patch:
            resilience:
              mode: "margin"
              perturbations: ["irrelevant_perturbation"]
              seeds: [0, 1, 2]
              intensities: [0.0, 0.2, 0.5, 0.8, 1.0]
